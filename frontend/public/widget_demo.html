<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskBuddy Voice Widget Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TaskBuddy Voice Assistant</h1>
        <p>The voice widget will appear at the bottom right.</p>
    </div>

    <script>
      (function (d, t) {
        var g = document.createElement(t),
          s = d.getElementsByTagName(t)[0];
        g.src =
          "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        g.defer = true;
        g.async = true;
        s.parentNode.insertBefore(g, s);

        g.onload = function () {
          // --- VAPI Configuration ---
          // 1. Get your Public Key from the VAPI Dashboard.
          const VAPI_PUBLIC_KEY = '38a5bc22-1c43-4d10-95b6-29dcad2aa65d'; // Replace with your key.

          // 2. Create an Assistant in the VAPI Dashboard and get its ID.
          //    - In the assistant's settings, set the Server URL to your ngrok webhook.
          //    - Add the 'processTaskInput' function in the Tools section.
          const VAPI_ASSISTANT_ID = 'eaa2fc13-f1cb-4870-bd98-f58dbaddd65b'; // Replace with your ID.

          if (VAPI_ASSISTANT_ID === 'your_assistant_id_here' || !VAPI_ASSISTANT_ID) {
            const container = document.querySelector('.container');
            if (container) {
                const warning = document.createElement('p');
                warning.style.color = '#ffc107';
                warning.style.border = '1px solid #ffc107';
                warning.style.padding = '10px';
                warning.style.borderRadius = '5px';
                warning.innerHTML = '<b>Configuration Needed:</b> Open <code>widget_demo.html</code> and replace <code>"your_assistant_id_here"</code> with your actual VAPI Assistant ID.';
                container.appendChild(warning);
            }
            console.error('VAPI Configuration Error: VAPI_ASSISTANT_ID is not set. Please edit widget_demo.html.');
            return;
          }

          // This runs the VAPI widget using your pre-configured assistant.
          window.vapiSDK.run({
            apiKey: VAPI_PUBLIC_KEY,
            assistant: VAPI_ASSISTANT_ID
          });
        };
      })(document, "script");
    </script>
</body>
</html>
